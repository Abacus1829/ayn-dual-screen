modLoader = "javafml"
loaderVersion = "[52,)"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

# MinecraftForge wants "mandatory"; "type = required" is NeoForge's spelling and Forge rejects the whole
# file as invalid if it finds it, with no hint that the two loaders differ here.
[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_version},)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    # Filled from the build target, so a jar declares the versions it was actually compiled against
    # rather than a range someone hoped would work.
    versionRange = "${mc_range}"
    ordering = "NONE"
    side = "CLIENT"
