org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The default build target. Pinned rather than left open-ended so a snapshot of this folder rebuilds
# into the same jar months from now.
#
# Other targets need no edit here:
#   gradlew build -Pmc=1.21.11 -Pforge=61.1.14 -Prange="[1.21.9,1.22)"
#
# buildAll.ps1 walks the targets that are actually known to compile.
minecraft_version=1.21.1
forge_version=52.1.0
mc_range=[1.21,1.22)
mapping_channel=official

mod_id=ayndualscreen
mod_name=Ayn Dual Screen
mod_version=0.7.0
mod_group=com.abacus.dualscreen
mod_authors=Abacus
mod_description=A second screen for Minecraft on the AYN Thor: inventory, effects, minimap and status on a phone or handheld over your local network.
